<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F7F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1424" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="기도와 말씀">
<meta name="application-name" content="기도와 말씀">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>기도와 말씀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: one phone-width column (max 480px). Sunrise/night hill hero on the prayer tab, fixed bottom nav, bottom sheets for writing. */
:root{
  --bg:#F7F8FB; --surface:#FFFFFF; --line:#E6E8EF; --fg:#1A1A1A; --muted:#4A4F5C; --faint:#6B7080;
  --chip-line:#D6D9E2; --soft:#F3F4F7; --accent:#2F5BD3; --accent-ink:#1E3F9E; --accent-tint:#E8EDFB;
  --on-accent:#FFFFFF; --strong:#1A1A1A; --on-strong:#FFFFFF; --warn:#B4461B; --warn-tint:#FCEBE3;
  --bar:#9DB6EE; --target:#D2561A; --scrim:rgba(15,20,35,.45); --shadow:rgba(26,26,26,.18);
  --o-bg:#E8EDFB; --o-fg:#1E3F9E; --x-bg:#EEEFF3; --x-fg:#3F4452; --w-bg:#DFF0F5; --w-fg:#14596B; --h-bg:#FCEBDD; --h-fg:#8A3D0B;
  --day:block; --night:none; --hero-ink:#2A2620;
  --font:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#18203A; --line:#26304D; --fg:#E9ECF5; --muted:#B4BBCD; --faint:#9AA3BB;
  --chip-line:#34405E; --soft:#1F2844; --accent:#6EAAFF; --accent-ink:#9CC2FF; --accent-tint:#1E2E55;
  --on-accent:#0E1424; --strong:#E9ECF5; --on-strong:#0E1424; --warn:#FFB08A; --warn-tint:#3A2418;
  --bar:#3D5E9C; --target:#FFB08A; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  --o-bg:#1E2E55; --o-fg:#9CC2FF; --x-bg:#26304D; --x-fg:#C9CFDD; --w-bg:#14353F; --w-fg:#8FD3E6; --h-bg:#3A2418; --h-fg:#FFB08A;
  --day:none; --night:block; --hero-ink:#F3EBD2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#18203A; --line:#26304D; --fg:#E9ECF5; --muted:#B4BBCD; --faint:#9AA3BB;
  --chip-line:#34405E; --soft:#1F2844; --accent:#6EAAFF; --accent-ink:#9CC2FF; --accent-tint:#1E2E55;
  --on-accent:#0E1424; --strong:#E9ECF5; --on-strong:#0E1424; --warn:#FFB08A; --warn-tint:#3A2418;
  --bar:#3D5E9C; --target:#FFB08A; --scrim:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.5);
  --o-bg:#1E2E55; --o-fg:#9CC2FF; --x-bg:#26304D; --x-fg:#C9CFDD; --w-bg:#14353F; --w-fg:#8FD3E6; --h-bg:#3A2418; --h-fg:#FFB08A;
  --day:none; --night:block; --hero-ink:#F3EBD2; color-scheme:dark;
}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;word-break:keep-all;zoom:var(--ui-zoom,1)}
.theme-anim,.theme-anim *,.theme-anim *::before,.theme-anim *::after{transition:background-color .5s ease,color .5s ease,border-color .5s ease,box-shadow .5s ease!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.55s;animation-timing-function:ease}
.celebrate{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:var(--scrim);animation:cel-in .25s ease;cursor:pointer}
.celebrate.out{opacity:0;transition:opacity .4s ease}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.celebrate-card{position:relative;background:var(--surface);color:var(--fg);border-radius:22px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;max-width:min(320px,calc(100% - 48px));box-shadow:0 16px 40px var(--shadow);animation:cel-pop .45s cubic-bezier(.2,1.4,.4,1)}
.celebrate-card small{font-size:12px;font-weight:700;color:var(--accent-ink);letter-spacing:.04em}
.celebrate-card strong{font-size:22px;font-weight:800;line-height:1.35}
.celebrate-card span{font-size:14px;color:var(--muted);line-height:1.6}
@keyframes cel-in{from{opacity:0}to{opacity:1}}
@keyframes cel-pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.size-opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.size-sample{color:var(--muted)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
button{font-family:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;height:224px;overflow:hidden}
.hero.tall{height:280px}
.hero svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene-day,.logo-day{display:var(--day)!important}
.scene-night,.logo-night{display:var(--night)!important}
.hero h1{position:absolute;left:0;right:0;top:96px;margin:0;display:flex;justify-content:center}
.hero.tall h1{top:112px}
.hero h1 img{width:min(300px,78%);height:auto}
.hero .hero-btn{position:absolute;top:12px;right:max(8px,env(safe-area-inset-right,0px));color:var(--hero-ink)}
.hero .hero-btn:hover{background:transparent}

/* common */
.topbar{padding-block:28px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.topbar h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.5px}
.icon-btn{width:44px;height:44px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--fg);flex-shrink:0}
.icon-btn:hover{background:var(--soft)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--chip-line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--strong);border-color:var(--strong);color:var(--on-strong);font-weight:700}
.filterbar{background:var(--surface);border-bottom:1px solid var(--line)}
.list{display:flex;flex-direction:column;gap:12px;padding-block:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-tint);color:var(--accent);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.avatar.anon{background:var(--soft);color:var(--faint)}
.name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:12px;color:var(--faint);white-space:nowrap}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--accent-tint);color:var(--accent-ink);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.warn{background:var(--warn-tint);color:var(--warn)}
.pill.muted{background:var(--soft);color:var(--faint)}
.ans-O{background:var(--o-bg);color:var(--o-fg)} .ans-X{background:var(--x-bg);color:var(--x-fg)}
.ans-WAIT{background:var(--w-bg);color:var(--w-fg)} .ans-HISWAY{background:var(--h-bg);color:var(--h-fg)}
.content{margin:0;font-size:15px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.comment{margin:0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:14px;line-height:1.6;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:13px;color:var(--muted)} .count b{color:var(--fg)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:none;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn-accent{background:var(--accent);color:var(--on-accent)}
.btn-wait{background:var(--soft);color:var(--muted);border:1px solid var(--chip-line);font-weight:500}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--chip-line);font-weight:500}
.btn-strong{background:var(--strong);color:var(--on-strong)}
.btn-danger{background:var(--warn);color:var(--surface)}
.btn-block{width:100%;min-height:52px;font-size:16px;border-radius:14px}
.btn-sm{min-height:40px;padding:0 12px;font-size:13px}
.empty{padding:40px 16px;text-align:center;color:var(--faint);font-size:14px;line-height:1.7}
.fab{position:fixed;z-index:20;right:max(20px,calc(50vw - 220px));bottom:calc(100px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border-radius:26px;border:none;background:var(--strong);color:var(--on-strong);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px var(--shadow)}
.nav{position:fixed;z-index:30;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;box-sizing:border-box;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px max(8px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--faint);min-height:52px}
.nav button.on{color:var(--accent);font-weight:700}
.nav-ic{position:relative;display:inline-flex}
.nav-dot{position:absolute;top:-1px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.demo{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px;background:var(--accent-tint);color:var(--accent-ink);font-size:12px}
.demo button{background:none;border:none;color:var(--accent-ink);font-size:12px;font-weight:700;text-decoration:underline;min-height:32px}
.toast{position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));background:var(--strong);color:var(--on-strong);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;width:max-content;max-width:calc(100% - 32px);box-shadow:0 8px 24px var(--shadow);text-align:center;line-height:1.5}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-top:10px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;box-sizing:border-box;cursor:auto}
.grabber{align-self:center;width:40px;height:4px;border-radius:2px;background:var(--chip-line)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-head h2{margin:0;font-size:20px;font-weight:800}
.field{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;border:none;min-width:0}
.label{font-size:13px;font-weight:700;color:var(--muted);padding:0}
.hint{font-size:12px;color:var(--faint);line-height:1.5}
textarea,input[type=text],input[type=email],input[type=password],input[type=date]{width:100%;box-sizing:border-box;border:1.5px solid var(--chip-line);background:var(--bg);color:var(--fg);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;min-height:48px}
textarea{min-height:140px;resize:vertical;line-height:1.6}
textarea:focus,input:focus{border-color:var(--accent);outline:none}
.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{min-height:64px;border-radius:14px;border:1.5px solid var(--chip-line);background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 14px;text-align:left}
.choice strong{font-size:16px;color:var(--fg)}
.choice small{font-size:12px;color:var(--faint);font-weight:500}
.choice.on{border:2px solid var(--accent);background:var(--accent-tint)}
.choice.on small{color:var(--accent-ink)}
.choice.wide{grid-column:1/-1;min-height:48px;flex-direction:row;align-items:center;gap:8px}
.note{padding:12px 14px;border-radius:12px;background:var(--accent-tint);color:var(--fg);font-size:14px;display:flex;gap:8px;align-items:center}
.note svg{color:var(--accent);flex-shrink:0}
.switchrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;cursor:pointer}
.switchrow span{display:flex;flex-direction:column;gap:2px}
.switchrow b{font-size:15px;font-weight:500}
.switchrow small{font-size:12px;color:var(--faint)}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--chip-line);position:relative;flex-shrink:0;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw:checked{background:var(--accent)}
.sw:checked::after{transform:translateX(20px)}
.btn-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* bible */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));padding:4px;gap:4px;border-radius:12px;background:var(--soft)}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{min-height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 3px var(--shadow)}
.bible-head{padding-block:16px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border-bottom:1px solid var(--line)}
.goal-row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.eyebrow{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.02em}
.big{margin:0;font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.bar{height:8px;border-radius:4px;background:var(--accent-tint);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.readers{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.readers b{color:var(--accent-ink)}
.stack{display:flex}
.stack span{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);margin-left:-8px;background:var(--accent-tint);color:var(--accent-ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stack span:first-child{margin-left:0}
.book-title{display:flex;justify-content:space-between;align-items:baseline;padding-block:4px 10px}
.book-title h2{margin:0;font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding-bottom:190px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ch{height:44px;border-radius:10px;border:1.5px solid var(--chip-line);background:var(--surface);color:var(--fg);font-size:14px;font-weight:500;position:relative;padding:0}
.ch.done{background:var(--strong);border-color:var(--strong);color:var(--on-strong);font-weight:700}
.ch.sel{background:var(--accent-tint);border:2px solid var(--accent);color:var(--accent-ink);font-weight:800}
.ch.del{background:var(--warn-tint);border:2px solid var(--warn);color:var(--warn);font-weight:800;text-decoration:line-through}
.ch:disabled{opacity:.35;cursor:default}
.book-title{flex-wrap:wrap;gap:8px}
.ch sup{position:absolute;top:3px;right:4px;font-size:9px;line-height:1}
.confirm{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:calc(min(480px,100%) - 24px);box-sizing:border-box;background:var(--strong);color:var(--on-strong);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px var(--shadow)}
.confirm small{font-size:12px;opacity:.75;line-height:1.5}
.confirm strong{font-size:17px}
.confirm .btn-ghost{color:var(--on-strong);border-color:currentColor;opacity:.85}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.panel h2{margin:0;font-size:16px;font-weight:800}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panels{display:flex;flex-direction:column;gap:12px;padding-block:12px}
.ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:23px;font-weight:800;line-height:1}
.ring small{font-size:11px;color:var(--faint);margin-top:4px}
.goal{display:flex;align-items:center;gap:20px}
.goal-text{display:flex;flex-direction:column;gap:10px;min-width:0}
.goal-text .per{font-size:28px;font-weight:800;color:var(--accent-ink);line-height:1.2}
.goal-text p{margin:0;font-size:13px;line-height:1.6;color:var(--muted)}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:end;height:130px;border-bottom:1px solid var(--line);position:relative}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.chart .col span{font-size:11px;color:var(--faint)}
.chart .col i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--bar);min-height:3px}
.chart .col.today i{background:var(--accent)}
.chart .col.today span{color:var(--accent-ink);font-weight:800}
.chart .target{position:absolute;left:0;right:0;border-top:1.5px dashed var(--target);pointer-events:none}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-top:-8px;font-size:12px;color:var(--faint);text-align:center}
.days .today{color:var(--accent-ink);font-weight:800}
.legend{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.legend i{width:16px;border-top:1.5px dashed var(--target);display:inline-block}
.board{display:flex;flex-direction:column;gap:10px}
.board div{display:grid;grid-template-columns:90px minmax(0,1fr) 52px;align-items:center;gap:10px;font-size:13px}
.board .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.board .nm em{font-style:normal;width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0}
.board .me .nm,.board .me .pc{color:var(--accent-ink);font-weight:800}
.board .pc{text-align:right;color:var(--muted)}
.board .bar{height:8px}
.board .bar i{background:var(--bar)}
.board .me .bar i{background:var(--accent)}

/* answers & me */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{padding:12px 10px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tile small{font-size:12px;font-weight:700;color:var(--faint)}
.tile b{font-size:20px;font-weight:800}

/* ─── 통독 진행 계산 ─── */
function computeProgress(profile, readings){
  const start = profile.plan_start, end = profile.plan_end, times = profile.plan_times || 1, scope = profile.plan_scope || 'ALL';
  const counts = new Map(); const today = appToday(); let todayCount = 0;
  for(const r of readings){
    if(r.read_on === today) todayCount++;
    if(r.read_on >= start && r.read_on <= end){ const k = r.book+'-'+r.chapter; counts.set(k, (counts.get(k)||0)+1); }
  }
  let done = 0, total = 0;
  for(const b of BOOKS){
    if(scope !== 'ALL' && b.t !== scope) continue;
    total += b.c*times;
    for(let c=1;c<=b.c;c++) done += Math.min(counts.get(b.id+'-'+c)||0, times);
  }
  let daysLeft;
  if(today > end) daysLeft = 0; else if(today < start) daysLeft = daysBetween(start,end)+1; else daysLeft = daysBetween(today,end)+1;
  const remaining = total - done;
  return {counts, done, total, remaining, pct: total ? done/total*100 : 0, daysLeft, perDay: daysLeft>0 ? remaining/daysLeft : 0, todayCount, start, end, times, scope};
}

  const sess = () => db.session ? {user:{id:ME, email:db.profile.email}} : null;
  const nick = u => u === ME ? db.profile.nickname : db.users[u]?.nickname;
  const role = (g,u=ME) => db.members.find(m => m.group_id === g && m.user_id === u)?.role || null;
  const canView = g => db.profile.is_super_admin || !!role(g);
  const canMod = g => db.profile.is_super_admin || role(g) === 'admin';
  const deny = () => { throw {message:'NOT_ALLOWED'}; };
  const view = p => {
    const my = db.marks.filter(m => m.id === p.id), mine = p.user_id === ME;
    return {id:p.id, content:p.content, author: (p.is_anonymous && !mine) ? null : nick(p.user_id), is_mine:mine, is_anonymous:p.is_anonymous,
      ends_at:p.ends_at, created_at:p.created_at, mark_count:p.base + my.length, my_mark_count:my.length, my_last_mark: my.length ? my[my.length-1].at : null,

  return {
    async init(){ try{ db = JSON.parse(lsGet(KEY)); }catch(e){ db = null; } if(!db || db.v !== 2){ db = seed(); save(); } db.readings.forEach((r,i) => { if(r.id == null) r.id = i+1; }); S.session = sess(); },
    async signIn(email){ db.session = true; if(email) db.profile.email = email; save(); return {session:sess()}; },

    async checkCode(code){ return db.groups.some(x => x.code === String(code||'').trim().toUpperCase()); },
    async lastGroup(){ const m = db.members.filter(x => x.user_id === ME).sort((a,b) => new Date(b.joined_at) - new Date(a.joined_at))[0]; return m ? m.group_id : null; },
    async signOut(){ db.session = false; save(); },
    async resetPassword(){ },
    async updatePassword(){ },
    async deleteAccount(pw){ if(db.profile.is_super_admin) throw {message:'SUPER_ADMIN'}; if(String(pw).length < 6) throw {message:'BAD_PASSWORD'}; db = seed(); db.session = false; save(); },
    async loadProfile(){ return {...db.profile}; },
    async updateProfile(p){ if(p.nickname && Object.values(db.users).some(u => u.nickname === p.nickname)) throw {code:'23505'}; Object.assign(db.profile, p); save(); return {...db.profile}; },
    async loadGroups(){ if(!db.profile.is_super_admin) return []; return db.groups.map(g => ({...g, my_role: role(g.id), member_count: db.members.filter(m => m.group_id === g.id).length})); },
    async groupInfo(g){ if(!canView(g)) throw {message:'NOT_MEMBER'}; const x = db.groups.find(y => y.id === g); return x ? {...x, code: canMod(g) ? x.code : null, my_role: role(g), member_count: db.members.filter(m => m.group_id === g).length} : null; },
    async setSuper(v){ db.profile.is_super_admin = v; save(); },
    async joinGroup(c){ const g = db.groups.find(x => x.code === String(c).trim().toUpperCase()); if(!g) throw {message:'BAD_CODE'}; if(!role(g.id)) db.members.push({group_id:g.id, user_id:ME, role:'member', joined_at:new Date().toISOString()}); save(); return g.id; },
    async leaveGroup(g){ db.members = db.members.filter(m => !(m.group_id === g && m.user_id === ME)); save(); },
    async createGroup(name){ if(!db.profile.is_super_admin) deny(); const id = 'g'+Date.now(); db.groups.push({id, name, code:code()}); db.members.push({group_id:id, user_id:ME, role:'admin', joined_at:new Date().toISOString()}); save(); return id; },
    async renameGroup(g,name){ if(!db.profile.is_super_admin) deny(); db.groups.find(x => x.id === g).name = name; save(); },
    async deleteGroup(g){ if(!db.profile.is_super_admin) deny(); db.groups = db.groups.filter(x => x.id !== g); db.members = db.members.filter(m => m.group_id !== g); db.prayers = db.prayers.filter(p => p.group_id !== g); save(); },
    async setRole(g,u,r){ if(!db.profile.is_super_admin) deny(); const m = db.members.find(x => x.group_id === g && x.user_id === u); if(m) m.role = r; save(); },
    async listMembers(g){ if(!canMod(g)) deny(); return db.members.filter(m => m.group_id === g).map(m => ({user_id:m.user_id, nickname:nick(m.user_id), role:m.role, joined_at:m.joined_at})).sort((a,b) => (b.role==='admin') - (a.role==='admin') || a.nickname.localeCompare(b.nickname)); },
    async removeMember(g,u){ if(!canMod(g) || u === ME || (role(g,u) === 'admin' && !db.profile.is_super_admin)) deny(); db.members = db.members.filter(m => !(m.group_id === g && m.user_id === u)); save(); },
    async regenCode(g){ if(!canMod(g)) deny(); const gr = db.groups.find(x => x.id === g); gr.code = code(); save(); return gr.code; },
    async loadPrayers(g){
      if(!canView(g)) throw {message:'NOT_MEMBER'};
      const now = Date.now();
      return db.prayers.filter(p => p.group_id === g && (p.user_id === ME || (!p.answer && new Date(p.ends_at) > now) || (ARCHIVED.includes(p.answer) && p.answer_public)))
        .map(view).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
    },
    async createPrayer(o){ if(!canView(o.group_id)) deny(); db.prayers.push({id:Date.now(), user_id:ME, base:0, created_at:new Date().toISOString(), answer:null, answer_comment:null, answered_at:null, answer_public:db.profile.answer_public_default, ...o}); save(); },
    async markPrayer(id){
      const p = db.prayers.find(x => x.id === id);
      if(!p || p.answer || new Date(p.ends_at) <= Date.now()) throw {message:'PRAYER_CLOSED'};
      const mine = db.marks.filter(m => m.id === id), last = mine[mine.length-1];
      if(last && Date.now() - new Date(last.at) < HOUR) throw {message:'TOO_SOON'};
      db.marks.push({id, at:new Date().toISOString()}); save();
    },
    async answerPrayer(id,o){ Object.assign(db.prayers.find(x => x.id === id), o, {answered_at: o.answer ? new Date().toISOString() : null}); save(); },
    async setAnswerPublic(id,v){ db.prayers.find(x => x.id === id).answer_public = v; save(); },
    async deletePrayer(id){ db.prayers = db.prayers.filter(x => x.id !== id); db.marks = db.marks.filter(m => m.id !== id); save(); },
    async modDelete(id){ const p = db.prayers.find(x => x.id === id); if(!p) return; if(!(p.user_id === ME || canMod(p.group_id))) deny(); return this.deletePrayer(id); },
    async loadReadings(){ return db.readings.slice(); },
    async addReadings(list){ const d = appToday(), base = Date.now(); list.forEach((r,i) => db.readings.push({id:base+i, book:r.book, chapter:r.chapter, read_on:d})); save(); },
    async deleteReadings(ids){ const set = new Set(ids); db.readings = db.readings.filter(r => !set.has(r.id)); save(); },
    async loadBoard(g){
      if(!canView(g)) throw {message:'NOT_MEMBER'};
      const me = computeProgress(db.profile, db.readings);
      return db.members.filter(m => m.group_id === g).map(m => m.user_id === ME
        ? {nickname:db.profile.nickname, pct:Math.floor(me.pct*10)/10, is_me:true}
        : {nickname:db.users[m.user_id].nickname, pct:db.users[m.user_id].pct, is_me:false}).sort((a,b) => b.pct - a.pct);
    },
    async todayReaders(g){
      if(!canView(g)) throw {message:'NOT_MEMBER'};
      const today = appToday();
      return db.members.filter(m => m.group_id === g && (m.user_id === ME ? db.readings.some(r => r.read_on === today) : db.users[m.user_id].today)).length;
    },
    async sendInquiry(o){ db.inquiries = db.inquiries || []; db.inquiries.push({id:Date.now(), user_id:ME, created_at:new Date().toISOString(), ...o}); save(); },
    async adminInquiries(){ if(!db.profile.is_super_admin) deny(); return (db.inquiries||[]).map(q => ({id:q.id, nickname:nick(q.user_id), email: q.user_id === ME ? db.profile.email : `${q.user_id}@example.com`, group_name: db.groups.find(g => g.id === q.group_id)?.name || null, content:q.content, created_at:q.created_at})).sort((a,b) => new Date(b.created_at) - new Date(a.created_at)); },
    async reset(){ db = seed(); save(); S.session = sess(); }
  };
}

function markBtn(p){
  const last = p.my_last_mark ? new Date(p.my_last_mark).getTime() : 0, left = last + HOUR - Date.now();
  if(left > 0) return `<button class="btn btn-wait" disabled>${I.clock(16)}${Math.ceil(left/60000)}분 후 다시</button>`;
  return `<button class="btn btn-accent" data-act="mark" data-id="${p.id}">${I.check(16)}기도했어요</button>`;
}
const modBtn = p => (!p.is_mine && canModerate()) ? `<button class="btn btn-sm btn-ghost mod" data-act="askModDelete" data-id="${p.id}" aria-label="관리자 권한으로 이 기도제목 삭제">${I.shield(14)}삭제</button>` : '';
function prayerCard(p){
  const active = !p.answer && new Date(p.ends_at) > Date.now();
  let foot = `<div class="card-foot"><span class="count">함께 기도 <b class="num">${p.mark_count}</b>회</span><span class="foot-actions">${modBtn(p)}${active ? markBtn(p) : ''}</span></div>`;
  const comment = (p.answer && p.answer_comment) ? `<p class="comment">${esc(p.answer_comment)}</p>` : '';
  if(p.is_mine){
    const answerLabel = p.answer ? '응답 수정' : (active ? '응답받았어요' : '응답 기록');
    foot += `<div class="row-actions">
      <button class="btn btn-sm ${!p.answer && !active ? 'btn-strong' : 'btn-ghost'}" data-act="openAnswer" data-id="${p.id}">${answerLabel}</button>
      ${ARCHIVED.includes(p.answer) ? `<span class="pill muted">${p.answer_public ? I.globe(13)+'보관함에 공개' : I.lock(13)+'나만 보기'}</span>` : ''}
      <button class="btn btn-sm btn-ghost" style="margin-left:auto" data-act="askDelete" data-id="${p.id}">삭제</button></div>`;
  }
  return `<article class="card">
    <div class="card-top">${whoHtml(p, rel(p.created_at))}${p.answer ? ansBadge(p.answer) : ddayPill(p.ends_at)}</div>
    <p class="content">${esc(p.content)}</p>${comment}${foot}</article>`;
}

function prayHtml(){
  const g = curGroup();
  if(!g) return heroHtml(false, false) + demoBar() + `<div class="panels pad">${joinBox()}</div>`;
  const now = Date.now(), P = S.prayers;
  const active = P.filter(p => !p.answer && new Date(p.ends_at) > now);
  const mine = P.filter(p => p.is_mine);
  const soon = active.filter(p => new Date(p.ends_at) - now < DAY);
  const list = {active, mine, soon}[S.prayTab];
  const tabs = [['active','진행 중',active.length],['mine','내 기도제목',mine.length],['soon','곧 마감',soon.length]];
  const emptyMsg = {active:'아직 나눠진 기도제목이 없어요.<br>첫 기도제목을 나눠 보세요.', mine:'내가 나눈 기도제목이 여기에 모여요.', soon:'오늘 마감되는 기도제목이 없어요.'}[S.prayTab];
  return heroHtml(false, true) + demoBar() +
    `<div class="filterbar pad">${serverBar()}<div class="chips">${tabs.map(([k,l,n]) => `<button class="chip ${S.prayTab===k?'on':''}" data-act="prayTab" data-v="${k}" aria-pressed="${S.prayTab===k}">${l} <span class="num">${n}</span></button>`).join('')}</div></div>
    <div class="list pad">${list.length ? list.map(prayerCard).join('') : `<p class="empty">${emptyMsg}</p>`}</div>
    <button class="fab" data-act="compose">${I.plus(18)}기도제목</button>`;
}

function bibleHtml(){
  const pr = computeProgress(S.profile, S.readings);
  return `<div class="topbar pad" style="background:var(--surface)"><h1>성경 통독</h1></div>
    <div class="pad" style="background:var(--surface);padding-bottom:4px"><div class="seg" role="tablist">
      <button class="${S.bibleView==='check'?'on':''}" data-act="bibleView" data-v="check" aria-pressed="${S.bibleView==='check'}">읽은 장 체크</button>
      <button class="${S.bibleView==='stats'?'on':''}" data-act="bibleView" data-v="stats" aria-pressed="${S.bibleView==='stats'}">통계</button></div></div>` +
    demoBar() + (S.bibleView === 'check' ? checkHtml(pr) : statsHtml(pr));
}
function planLabel(pr){
  const y1 = pr.start.slice(0,4), y2 = pr.end.slice(0,4);
  const period = (pr.start.endsWith('-01-01') && pr.end.endsWith('-12-31') && y1===y2) ? `${y1}년` : `${ymd(pr.start)} – ${ymd(pr.end)}`;
  return `${period} · ${SCOPE_NAME[pr.scope]} ${pr.times}회`;
}
function readersHtml(){
  if(!curGroup()) return '';
  const n = S.todayReaders;
  return `<div class="readers">${I.users(16)}${n ? `<span>${esc(curGroup().name)}에서 오늘 <b class="num">${n}명</b>이 읽었어요</span>` : `<span>${esc(curGroup().name)}에서 오늘은 아직 읽은 사람이 없어요</span>`}</div>`;
}
function checkHtml(pr){
  const testaments = pr.scope === 'ALL' ? ['OT','NT'] : [pr.scope];
  if(!testaments.includes(S.testament)) S.testament = testaments[0];
  const books = BOOKS.filter(b => b.t === S.testament);
  const doneIn = b => { let n = 0; for(let c=1;c<=b.c;c++) if((pr.counts.get(b.id+'-'+c)||0) >= pr.times) n++; return n; };
  if(!books.some(b => b.id === S.bookId)){ const next = books.find(b => doneIn(b) < b.c) || books[0]; S.bookId = next.id; }
  const book = BOOK[S.bookId];
  const tabs = testaments.length > 1 ? `<div class="seg">${testaments.map(t => `<button class="${S.testament===t?'on':''}" data-act="testament" data-v="${t}" aria-pressed="${S.testament===t}">${SCOPE_NAME[t]} ${t==='OT'?39:27}권</button>`).join('')}</div>` : '';
  const chips = books.map(b => { const full = doneIn(b) === b.c; return `<button class="chip ${b.id===S.bookId?'on':''}" data-act="book" data-v="${b.id}" aria-pressed="${b.id===S.bookId}">${b.name}${full ? I.check(14) : ''}</button>`; }).join('');
  let cells = '';
  const allCounts = new Map(); S.readings.forEach(r => { const k = r.book+'-'+r.chapter; allCounts.set(k, (allCounts.get(k)||0)+1); });
  for(let c=1;c<=book.c;c++){
    const k = book.id+'-'+c, n = pr.counts.get(k) || 0, sel = S.sel.has(k);
    const label = `${book.name} ${c}장${n>0 ? `, ${n}번 읽음` : ''}`;
    const sup = n>1 || (pr.times>1 && n>0) ? `<sup>×${n}</sup>` : '';
    if(S.fixMode){
      const has = (allCounts.get(k) || 0) > 0;
      cells += `<button class="ch num ${sel ? 'del' : (n>0 ? 'done' : '')}" data-act="ch" data-k="${k}" aria-pressed="${sel}" aria-label="${label}${has ? '' : ', 지울 기록 없음'}" ${has ? '' : 'disabled'}>${c}${sup}</button>`;
    } else {
      cells += `<button class="ch num ${sel ? 'sel' : (n>0 ? 'done' : '')}" data-act="ch" data-k="${k}" aria-pressed="${sel}" aria-label="${label}">${c}${sup}</button>`;
    }
  }
  return `<section class="bible-head pad">
      <div class="goal-row"><div><div class="eyebrow">${planLabel(pr)}</div><p class="big num">${floor1(pr.pct)}%</p></div>
        <span class="count num"><b>${pr.done.toLocaleString('ko-KR')}</b> / ${pr.total.toLocaleString('ko-KR')}장</span></div>
      <div class="bar"><i style="width:${Math.min(100,pr.pct)}%"></i></div>
      ${readersHtml()}
      ${tabs}
    </section>
    <div class="pad"><div class="chips">${chips}</div>
      <div class="book-title"><div style="display:flex;align-items:baseline;gap:8px"><h2>${book.name}</h2><span class="count num">${doneIn(book)} / ${book.c}장</span></div>
        <button class="btn btn-sm ${S.fixMode ? 'btn-strong' : 'btn-ghost'}" data-act="toggleFix" aria-pressed="${!!S.fixMode}">${S.fixMode ? '고치기 끝' : '잘못 누른 기록 지우기'}</button></div>
      <p class="hint" style="margin:-4px 0 10px">${S.fixMode ? '지울 장을 누르세요. 그 장의 가장 최근 읽은 기록 하나가 지워져요.' : '누른 채로 밀면 여러 장을 한 번에 고를 수 있어요'}</p>
      <div class="grid">${cells}</div></div>
    ${S.sel.size ? (S.fixMode ? unreadHtml() : confirmHtml()) : ''}`;
}
function selDetail(){
  const groups = {};
  [...S.sel].forEach(k => { const [b,c] = k.split('-').map(Number); (groups[b] = groups[b] || []).push(c); });
  return Object.keys(groups).map(Number).sort((a,b)=>a-b).map(b => `${BOOK[b].name} ${groups[b].sort((x,y)=>x-y).join(', ')}장`).join(' · ');
}
function unreadHtml(){
  return `<div class="confirm" role="region" aria-label="읽은 기록 지우기">
    <div style="display:flex;flex-direction:column;gap:2px"><small>${esc(selDetail())}</small><strong><span class="num">${S.sel.size}</span>장의 읽은 기록을 지울까요?</strong></div>
    <div class="btn-row"><button class="btn btn-ghost" data-act="clearSel">취소</button><button class="btn btn-danger" data-act="confirmUnread">지우기</button></div></div>`;
}
function confirmHtml(){
  const groups = {};
  [...S.sel].forEach(k => { const [b,c] = k.split('-').map(Number); (groups[b] = groups[b] || []).push(c); });
  const detail = Object.keys(groups).map(Number).sort((a,b)=>a-b).map(b => `${BOOK[b].name} ${groups[b].sort((x,y)=>x-y).join(', ')}장`).join(' · ');
  return `<div class="confirm" role="region" aria-label="읽은 장 등록">
    <div style="display:flex;flex-direction:column;gap:2px"><small>${esc(detail)}</small><strong>${md(appToday())}, <span class="num">${S.sel.size}</span>장 읽었습니다.</strong></div>
    <div class="btn-row"><button class="btn btn-ghost" data-act="clearSel">취소</button><button class="btn btn-accent" data-act="confirmRead">확인</button></div></div>`;
}
function statsHtml(pr){
  const today = appToday();
  const days = Array.from({length:7}, (_,i) => addDays(today, i-6));
  const perDayCount = Object.fromEntries(days.map(d => [d,0]));
  S.readings.forEach(r => { if(r.read_on in perDayCount) perDayCount[r.read_on]++; });
  const vals = days.map(d => perDayCount[d]), weekTotal = vals.reduce((a,b)=>a+b,0);
  const per = pr.perDay, scaleMax = Math.max(1, ...vals, per);
  const H = 100;
  const cols = days.map((d,i) => `<div class="col ${d===today?'today':''}"><span class="num">${vals[i]}</span><i style="height:${Math.round(vals[i]/scaleMax*H)}px"></i></div>`).join('');
  const dayLabels = days.map(d => `<span class="${d===today?'today':''}">${d===today ? '오늘' : weekday(d)}</span>`).join('');
  const target = per > 0 ? `<div class="target" style="bottom:${Math.round(per/scaleMax*H)}px"></div>` : '';
  let goalText;
  if(pr.remaining <= 0) goalText = `<span class="eyebrow">목표 달성</span><span class="per">완독!</span><p>${planLabel(pr)} 목표를 이뤘어요.</p>`;
  else if(pr.daysLeft === 0) goalText = `<span class="eyebrow">기간이 끝났어요</span><span class="per num">${floor1(pr.pct)}%</span><p>남은 ${pr.remaining.toLocaleString('ko-KR')}장 · 내 정보에서 기간을 늘릴 수 있어요</p>`;
  else goalText = `<span class="eyebrow">목표까지 하루에</span><span class="per num">${ceil1(per)}장</span><p class="num">남은 ${floor1(100-pr.pct)}% · ${pr.remaining.toLocaleString('ko-KR')}장 · ${pr.daysLeft}일<br>오늘 읽은 분량 <b>${pr.todayCount} / ${ceil1(per)}장</b></p>`;
  const g = curGroup();
  const board = S.board.map(b => `<div class="${b.is_me?'me':''}"><span class="nm">${esc(b.nickname)}</span><span class="bar"><i style="width:${Math.min(100,b.pct)}%"></i></span><span class="pc num">${Number(b.pct).toFixed(1)}%</span></div>`).join('');
  const boardPanel = g ? `<section class="panel">
      <div class="panel-head"><h2>함께 읽는 사람들</h2><span class="count">오늘 <b class="num">${S.todayReaders}명</b> 읽음</span></div>
      <span class="hint" style="margin-top:-8px">${esc(g.name)} 멤버</span>
      <div class="board">${board || '<span class="hint">아직 함께 읽는 사람이 없어요.</span>'}</div></section>`
    : `<section class="panel"><h2>함께 읽는 사람들</h2><p class="hint">서버에 들어가면 같은 서버 사람들의 진행률이 보여요.</p></section>`;
  return `<div class="panels pad">
    <section class="panel"><div class="goal">
      <div class="ring" role="img" aria-label="목표 달성률 ${floor1(pr.pct)}%" style="background:conic-gradient(var(--accent) 0 ${pr.pct}%, var(--accent-tint) 0)"><div><b class="num">${floor1(pr.pct)}%</b><small class="num">${pr.done.toLocaleString('ko-KR')} / ${pr.total.toLocaleString('ko-KR')}장</small></div></div>
      <div class="goal-text">${goalText}</div></div></section>
    <section class="panel">
      <div class="panel-head"><h2>최근 7일 읽은 성경</h2><span class="count num">${md(days[0])} – ${md(today)} · <b>${weekTotal}장</b></span></div>
      <div class="chart" role="img" aria-label="요일별 읽은 장 수: ${days.map((d,i)=>`${weekday(d)} ${vals[i]}장`).join(', ')}">${target}${cols}</div>
      <div class="days">${dayLabels}</div>
      ${per > 0 ? `<span class="legend"><i></i>목표 페이스 하루 ${ceil1(per)}장</span>` : ''}
    </section>${boardPanel}</div>`;
}

function answersHtml(){
  const g = curGroup();
  if(!g) return `<div class="topbar pad"><h1>응답 보관함</h1></div>` + demoBar() + `<div class="panels pad">${joinBox()}</div>`;
  const all = S.prayers.filter(p => ARCHIVED.includes(p.answer));
  const list = all.filter(p => S.ansScope === 'all' || p.is_mine).sort((a,b) => new Date(b.answered_at||0) - new Date(a.answered_at||0));
  const n = k => list.filter(p => p.answer === k).length;
  const cards = list.map(p => `<article class="card">
      <div class="card-top">${ansBadge(p.answer)}<span class="time">${whoName(p)} · ${p.answered_at ? md(kstDate(p.answered_at)) : ''}</span></div>
      <p class="content" style="font-weight:700">${esc(p.content)}</p>
      ${p.answer_comment ? `<p class="comment">${esc(p.answer_comment)}</p>` : ''}
      <div class="card-foot"><span class="count">함께 기도 <b class="num">${p.mark_count}</b>회</span><span class="foot-actions">${modBtn(p)}
      ${p.is_mine ? `<button class="btn btn-sm btn-ghost" data-act="togglePublic" data-id="${p.id}" aria-label="${p.answer_public ? '나만 보기로 바꾸기' : '보관함에 공개하기'}">${p.answer_public ? I.globe(15)+'공개 중' : I.lock(15)+'나만 보기'}</button>` : ''}</span></div>
    </article>`).join('');
  return `<div class="ans-head pad"><div class="between"><span class="eyebrow" style="color:var(--accent-ink)">응답 보관함 · ${esc(g.name)}</span></div>
      <h1>하나님이 하신 일 <span class="num">${list.length}</span>가지</h1>
      <div class="tiles">${ARCHIVED.map(k => `<div class="tile"><small>${ANSWERS[k][0]}</small><b class="num">${n(k)}</b></div>`).join('')}</div>
      <div class="seg"><button class="${S.ansScope==='all'?'on':''}" data-act="ansScope" data-v="all" aria-pressed="${S.ansScope==='all'}">모두의 응답</button><button class="${S.ansScope==='mine'?'on':''}" data-act="ansScope" data-v="mine" aria-pressed="${S.ansScope==='mine'}">내 응답</button></div>
    </div>` + demoBar() + `<div class="list pad">${cards || `<p class="empty">아직 기록된 응답이 없어요.<br>내 기도제목에서 응답을 기록하면 여기에 모여요.</p>`}</div>`;
}

/* ─── 달력 ─── */
function calHtml(target, value, min, max){
  if(!S.cal || S.cal.target !== target) S.cal = {target, month:(value || min || kstDate(Date.now())).slice(0,7)};
  const [y,m] = S.cal.month.split('-').map(Number);
  const first = new Date(Date.UTC(y,m-1,1)).getUTCDay(), n = new Date(Date.UTC(y,m,0)).getUTCDate();
  const today = kstDate(Date.now());
  let cells = WD.map((w,i) => `<span class="wd ${i===0?'sun':''}" aria-hidden="true">${w}</span>`).join('') + '<span></span>'.repeat(first);
  for(let d=1; d<=n; d++){
    const ds = `${y}-${pad2(m)}-${pad2(d)}`, dis = (min && ds < min) || (max && ds > max);
    cells += `<button type="button" class="cal-day num ${ds===value?'sel':''} ${ds===today?'today':''}" data-act="calPick" data-v="${ds}" ${dis?'disabled':''} aria-label="${m}월 ${d}일 ${weekday(ds)}요일" aria-pressed="${ds===value}">${d}</button>`;
  }
  return `<div class="cal" role="group" aria-label="날짜 고르기"><div class="cal-head">
      <button type="button" class="icon-btn" data-act="calNav" data-v="-1" aria-label="이전 달">${I.left(20)}</button><b class="num">${y}년 ${m}월</b>
      <button type="button" class="icon-btn" data-act="calNav" data-v="1" aria-label="다음 달">${I.right(20)}</button></div>
    <div class="cal-grid">${cells}</div></div>`;
}

      ${menuRow('page','화면과 글자 크기',`${{system:'시스템',light:'라이트',dark:'다크'}[S.theme]} · ${(FONT_SCALES[S.fontScale]||FONT_SCALES.md)[0]}`,'data-v="theme"')}</div></section>

    <button class="btn btn-ghost btn-block" data-act="signOut">로그아웃</button>

const fmtDT = ts => { const d = kstDate(ts); const t = new Date(new Date(ts).getTime() + 9*HOUR).toISOString().slice(11,16); return `${md(d)} ${t}`; };
function pageInquiry(){
  if(S.draft.inq === undefined) S.draft.inq = '';
  return subHead('문의하기') + `<div class="settings pad">

      <fieldset class="field"><legend class="label" style="margin-bottom:8px">어떻게 응답받으셨나요?</legend><div class="choice-grid">
        ${ARCHIVED.map(choice).join('')}
        <button type="button" class="choice wide ${a.answer==='NONE'?'on':''}" data-act="pickAnswer" data-v="NONE" aria-pressed="${a.answer==='NONE'}"><strong style="font-size:14px">선택 안 함</strong><small>보관함에 담지 않고 마무리해요</small></button></div></fieldset>
      <div class="field"><label class="label" for="answer-comment">한마디 남기기 (선택)</label><textarea id="answer-comment" maxlength="300" style="min-height:90px" data-model="answer.comment" placeholder="어떻게 응답받았는지 나눠주세요">${esc(a.comment)}</textarea></div>
      ${a.answer !== 'NONE' ? `<label class="switchrow"><span><b>응답 보관함에 공개</b><small>끄면 나만 볼 수 있어요</small></span><input class="sw" type="checkbox" id="answer-public" data-model="answer.public" ${a.public?'checked':''}></label>` : ''}
      <button class="btn btn-accent btn-block" data-act="submitAnswer" ${S.busy?'disabled':''}>응답 기록하기</button>
      ${p.answer ? `<button class="btn btn-ghost" data-act="clearAnswer">응답 기록 지우기</button>` : ''}`;
  } else if(t === 'servers'){
    body = `<div class="sheet-head"><h2>서버 바꾸기</h2><button class="icon-btn" data-act="close" aria-label="닫기">${I.x(22)}</button></div>
      <div class="menu">${S.groups.map(g => `<button class="menu-row" data-act="switchGroup" data-id="${g.id}" aria-pressed="${g.id===S.groupId}"><span>${esc(g.name)}<small class="hint" style="display:block">멤버 ${g.member_count}명${g.my_role==='admin' ? ' · 관리자' : (!g.my_role ? ' · 총 관리자로 보기' : '')}</small></span><span class="val" style="color:var(--accent)">${g.id===S.groupId ? I.check(20) : ''}</span></button>`).join('')}</div>
      <div class="field"><span class="label">다른 서버에 들어가기</span><form class="inline" data-form="join"><input id="join-code" type="text" class="code-input" maxlength="12" placeholder="입장 코드" aria-label="입장 코드" autocomplete="off" autocapitalize="characters"><button class="btn btn-accent" type="submit">들어가기</button></form></div>`;
  } else if(t === 'confirm'){
    body = `<div class="sheet-head"><h2>${S.sheet.title}</h2></div><p class="lead">${S.sheet.text}</p>
      <div class="btn-row"><button class="btn btn-ghost btn-block" data-act="close">취소</button><button class="btn btn-danger btn-block" data-act="confirmYes" ${S.busy?'disabled':''}>${S.sheet.yes}</button></div>`;
  }
  return `<div class="scrim" data-act="close"><div class="sheet pad" role="dialog" aria-modal="true" data-act="noop"><span class="grabber"></span>${body}</div></div>`;
}
function askConfirm(title, text, yes, run){ S.sheet = {type:'confirm', title, text, yes, run}; render(); }

/* ─── 렌더 ─── */
function render(){
  const app = document.getElementById('app');
  let html;
  if(S.fatal) html = heroHtml(true,false) + `<div class="auth pad"><p class="msg" role="alert">${esc(S.fatal)}</p><button class="btn btn-strong" data-act="retry">다시 시도</button></div>`;
  else if(!S.ready) html = heroHtml(true,false) + `<p class="empty">불러오는 중…</p>`;
  else if(S.recovery) html = recoveryHtml();
  else if(!S.session) html = authHtml();
  else if(!S.profile) html = heroHtml(true,false) + `<p class="empty">프로필을 불러오지 못했어요.</p>`;
  else if(!S.profile.nickname) html = nicknameHtml();
  else if(!isSuper() && !curGroup()) html = codeHtml();
  else html = ({pray:prayHtml, bible:bibleHtml, answers:answersHtml, me:meHtml}[S.tab])() + navHtml();
  app.innerHTML = html + sheetHtml();
  document.body.style.overflow = S.sheet ? 'hidden' : '';
}

let toastTimer;
function toast(text){ const t = document.getElementById('toast'); t.textContent = text; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800); }

function errMsg(e){
  const m = (e && (e.message || e.error_description)) || '';
  if(e && e.code === '23505') return '이미 다른 분이 쓰고 있는 별명이에요. 다른 별명을 정해주세요.';
  if(m.includes('TOO_SOON')) return '같은 기도제목은 1시간에 한 번 체크할 수 있어요.';
  if(m.includes('PRAYER_CLOSED')) return '기도 기간이 끝난 기도제목이에요.';
  if(m.includes('BAD_CODE')) return '이 코드로 들어갈 수 있는 서버가 없어요. 코드를 다시 확인해 주세요.';
  if(m.includes('NOT_MEMBER')) return '이 서버의 멤버가 아니에요. 입장 코드로 다시 들어와 주세요.';
  if(m.includes('NOT_ALLOWED') || m.includes('row-level security')) return '이 작업을 할 권한이 없어요.';
  if(m.includes('BAD_PASSWORD')) return '비밀번호가 맞지 않아요.';
  if(m.includes('SUPER_ADMIN')) return '총 관리자 계정은 앱에서 탈퇴할 수 없어요.';
  if(m.includes('should be different')) return '지금 쓰는 비밀번호와 다른 비밀번호로 정해주세요.';
  if(m.includes('Invalid login')) return '이메일이나 비밀번호가 맞지 않아요.';
  if(m.includes('already registered')) return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if(m.includes('Email not confirmed')) return '메일함에서 확인 링크를 먼저 눌러주세요.';
  if(m.includes('Password should be')) return '비밀번호는 6자 이상으로 정해주세요.';
  if(m.includes('not authorized') || m.includes('email_address_not_authorized')) return '지금은 이 이메일로 확인 메일을 보낼 수 없어요. 관리자에게 알려주세요.';
  if(m.includes('rate limit')) return '확인 메일을 너무 많이 보냈어요. 잠시 후 다시 해 주세요.';
  if(m.includes('Failed to fetch') || m.includes('NetworkError')) return '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';
  return m || '문제가 생겼어요. 잠시 후 다시 해 주세요.';
}

/* ─── 데이터 흐름 ─── */
const unseenInquiries = () => { const t = Number(lsGet('inboxSeenAt') || 0); return S.inbox.filter(q => new Date(q.created_at).getTime() > t).length; };
async function loadInquiries(){
  if(isSuper()){ try{ S.inbox = (await API.adminInquiries()) || []; }catch(e){ S.inbox = []; } } else S.inbox = [];
}
function pickGroup(){
  if(!S.groups.some(g => g.id === S.groupId)){
    const g = S.groups.find(x => x.my_role) || S.groups[0];
    S.groupId = g ? g.id : null;
  }
  lsSet('groupId', S.groupId || '');
}
async function loadGroups(){
  if(isSuper()){ S.groups = (await API.loadGroups()) || []; pickGroup(); return; }
  let info = null;
  if(!S.groupId){ try{ S.groupId = await API.lastGroup(); }catch(e){ S.groupId = null; } }
  if(S.groupId){ try{ info = await API.groupInfo(S.groupId); }catch(e){ info = null; } }
  S.groups = info ? [info] : [];
  if(!info){ S.groupId = null; lsSet('groupId', ''); }
}
async function loadGroupData(retry = true){
  const g = S.groupId;
  if(!g){ S.prayers = []; S.board = []; S.todayReaders = 0; return; }
  try{
    const [p,b,t] = await Promise.all([API.loadPrayers(g), API.loadBoard(g), API.todayReaders(g)]);
    if(g !== S.groupId) return;
    S.prayers = p || []; S.board = b || []; S.todayReaders = Number(t) || 0;
  }catch(e){
    if(retry && String(e?.message||'').includes('NOT_MEMBER')){ await loadGroups(); return loadGroupData(false); }
    throw e;
  }
}
async function boot(){
  if(!S.session){ S.profile = null; S.ready = true; render(); return; }
  try{
    const [profile, readings] = await Promise.all([API.loadProfile(), API.loadReadings()]);
    S.profile = profile; S.readings = readings || [];
    if(S.pendingCode){ const c = S.pendingCode; S.pendingCode = null; try{ S.groupId = await API.joinGroup(c); lsSet('groupId', S.groupId); S.codeMsg = null; }catch(e){ S.codeMsg = errMsg(e); } }
    await loadGroups(); await loadGroupData(); await loadInquiries();
  }catch(e){ toast(errMsg(e)); }
  S.ready = true; render();
}
async function start(){
  if(S.theme !== 'system') applyTheme();
  applyFontScale();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if(S.theme === 'system'){ const r = document.documentElement; r.classList.add('theme-anim'); setTimeout(() => r.classList.remove('theme-anim'), 650); } }); }catch(e){}
  render();
  try{ await API.init(); S.fatal = ''; }
  catch(e){ S.fatal = errMsg(e); S.ready = true; render(); return; }
  await boot();
}
function withThemeTransition(fn){
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce && document.startViewTransition){ try{ document.startViewTransition(fn); return; }catch(e){} }
  const r = document.documentElement;
  if(!reduce){ r.classList.add('theme-anim'); setTimeout(() => r.classList.remove('theme-anim'), 650); }
  fn();
}
function applyTheme(){ const r = document.documentElement; if(S.theme === 'system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); }
async function guard(fn){ if(S.busy) return; S.busy = true; try{ await fn(); }catch(e){ toast(errMsg(e)); }finally{ S.busy = false; render(); } }
async function switchTo(id){ S.groupId = id; lsSet('groupId', id); S.prayers = []; S.board = []; S.todayReaders = 0; S.prayTab = 'active'; await loadGroupData(); }

      async () => { await API.leaveGroup(d.id); await loadGroups(); await loadGroupData(); toast('서버에서 나왔어요'); });
  },
  copyCode(d){
    const done = () => toast(`입장 코드 ${d.v}를 복사했어요`);
    try{ navigator.clipboard.writeText(d.v).then(done, () => toast(`입장 코드: ${d.v}`)); }catch(e){ toast(`입장 코드: ${d.v}`); }
  },
  planScope(d){ S.draft.plan.scope = d.v; render(); },
  planTimes(d){ S.draft.plan.times = Math.min(10, Math.max(1, S.draft.plan.times + Number(d.v))); render(); },
  savePlan(){
    const d = S.draft.plan;
    if(!d.start || !d.end || d.end < d.start){ toast('종료일이 시작일보다 늦어야 해요'); return; }
    guard(async () => { S.profile = await API.updateProfile({plan_start:d.start, plan_end:d.end, plan_scope:d.scope, plan_times:d.times}); S.testament = null; S.bookId = null; S.page = null; S.cal = null; await loadGroupData(); toast('통독 목표를 저장했어요'); });
  },
  prefAnon(d,el){ guard(async () => { S.profile = await API.updateProfile({prayer_anon_default: el.checked}); toast('저장했어요'); }); },
  prefPublic(d,el){ guard(async () => { S.profile = await API.updateProfile({answer_public_default: el.checked}); toast('저장했어요'); }); },
  theme(d){ withThemeTransition(() => { S.theme = d.v; lsSet('theme', d.v); applyTheme(); render(); }); },
  fontScale(d){ S.fontScale = d.v; lsSet('fontScale', d.v); applyFontScale(); render(); },
  authMode(d){ S.authMode = d.v; S.authMsg = null; render(); },
  signOut(){ guard(async () => { await API.signOut(); S.session = null; S.profile = null; S.groups = []; S.groupId = null; lsSet('groupId',''); S.prayers = []; S.board = []; S.tab = 'pray'; S.page = null; S.sel.clear(); S.authMsg = null; S.codeMsg = null; S.authMode = 'login'; S.draft.auth = null; }); },
  async demoRole(){ if(!IS_DEMO) return; await API.setSuper(!isSuper()); S.page = null; S.sheet = null; S.ready = false; render(); await boot(); toast(isSuper() ? '총 관리자 화면으로 바꿨어요' : '서버 관리자 화면으로 바꿨어요'); },
};
const FORMS = {
  auth(){
    const email = document.getElementById('auth-email').value.trim(), pw = document.getElementById('auth-pw').value;
    const code = (document.getElementById('auth-code')?.value || '').trim();
    const signup = S.authMode === 'signup';
    S.authMsg = null; S.codeMsg = null; S.pendingCode = null;
    guard(async () => {
      try{
        if(signup){
          if(!code){ S.authMsg = {text:'서버 입장 코드를 입력해 주세요.'}; return; }
          if(!(await API.checkCode(code))){ S.authMsg = {text:errMsg({message:'BAD_CODE'})}; return; }
        }
        const data = signup ? await API.signUp(email, pw, code) : await API.signIn(email, pw);
        if(signup && !data?.session && data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0){ S.authMode = 'login'; S.draft.auth.code = ''; S.authMsg = {text:'이미 가입된 이메일이에요. 로그인해 주세요. 비밀번호가 기억나지 않으면 관리자에게 문의해 주세요.'}; return; }
        if(data?.session){ S.draft.auth = null; S.session = data.session; S.groupId = null; S.ready = false; render(); await boot(); }
        else if(signup){ S.draft.auth.pw = ''; S.draft.auth.code = ''; S.authMode = 'login'; S.authMsg = {ok:true, text:`${email}로 확인 메일을 보냈어요. 메일의 「가입 확인」 링크를 누르면 바로 로그인돼요. 메일이 안 보이면 스팸함도 확인해 주세요.`}; }
      }catch(e){ S.authMsg = {text:errMsg(e)}; }
    });
  },
  forgot(){
    const email = (document.getElementById('forgot-email')?.value || '').trim();
    if(!email) return;
    S.authMsg = null;
    guard(async () => {
      try{ await API.resetPassword(email); S.authMsg = {ok:true, text:`${email}로 비밀번호 재설정 링크를 보냈어요. 메일의 링크를 누르면 새 비밀번호를 정할 수 있어요. 메일이 안 보이면 스팸함도 확인해 주세요.`}; }
      catch(e){ S.authMsg = {text:errMsg(e)}; }
    });
  },
  newPassword(){
    const a = document.getElementById('new-pw')?.value || '', b = document.getElementById('new-pw2')?.value || '';
    if(a.length < 6){ S.authMsg = {text:'비밀번호는 6자 이상으로 정해주세요.'}; render(); return; }
    if(a !== b){ S.authMsg = {text:'두 비밀번호가 서로 달라요.'}; render(); return; }
    S.authMsg = null;
    guard(async () => {
      try{ await API.updatePassword(a); S.recovery = false; S.ready = false; render(); await boot(); toast('새 비밀번호로 바꿨어요'); }
      catch(e){ S.authMsg = {text:errMsg(e)}; }
    });
  },
  changePassword(){
    const a = document.getElementById('cp-pw')?.value || '', b = document.getElementById('cp-pw2')?.value || '';
    if(a.length < 6){ toast('비밀번호는 6자 이상으로 정해주세요'); return; }
    if(a !== b){ toast('두 비밀번호가 서로 달라요'); return; }
    guard(async () => { await API.updatePassword(a); S.page = null; toast('비밀번호를 바꿨어요'); });
  },
  deleteAccount(){
    const pw = document.getElementById('del-pw')?.value || '';
    if(!pw){ toast('비밀번호를 입력해 주세요'); return; }
    askConfirm('정말 탈퇴할까요?', '내 기도제목, 응답, 성경 읽기 기록, 문의가 모두 지워지고 되돌릴 수 없어요.', '탈퇴하기', async () => {
      await API.deleteAccount(pw);
      S.session = null; S.profile = null; S.groups = []; S.groupId = null; lsSet('groupId',''); S.prayers = []; S.board = []; S.readings = [];
      S.tab = 'pray'; S.page = null; S.authMode = 'login'; S.draft = {}; S.authMsg = {ok:true, text:'탈퇴했어요. 그동안 함께해 주셔서 고마워요.'};
    });
  },
  firstNick(){
    const v = document.getElementById('first-nick').value.trim();
    if(v.length < 2){ S.authMsg = {text:'별명은 2자 이상으로 정해주세요.'}; render(); return; }
    S.authMsg = null;
    guard(async () => { try{ S.profile = await API.updateProfile({nickname:v}); await loadGroupData(); }catch(e){ S.authMsg = {text:errMsg(e)}; } });
  },
  nickname(){
    const v = (S.draft.nick || '').trim();
    if(v.length < 2){ toast('별명은 2자 이상으로 정해주세요'); return; }
    if(v === S.profile.nickname){ S.page = null; render(); return; }
    guard(async () => { S.profile = await API.updateProfile({nickname:v}); S.page = null; await loadGroupData(); toast(`이제 '${v}'(으)로 보여요`); });
  },
  join(){
    const code = (document.getElementById('join-code')?.value || '').trim();
    if(!code){ toast('입장 코드를 입력해 주세요'); return; }
    guard(async () => {
      try{
        const id = await API.joinGroup(code); S.groupId = id; lsSet('groupId', id);
        await loadGroups(); S.sheet = null; S.codeMsg = null; await switchTo(id); S.tab = 'pray'; S.page = null; toast(`${curGroup()?.name || '서버'}에 들어왔어요`);
      }catch(e){ S.codeMsg = errMsg(e); if(curGroup()) toast(S.codeMsg); }
    });
  },
  inquiry(){
    const text = (S.draft.inq || '').trim();
    if(!text){ toast('문의 내용을 적어주세요'); return; }
    guard(async () => { await API.sendInquiry({content:text, group_id: S.groupId || null}); S.draft.inq = ''; S.page = null; toast('개발자에게 전했어요. 소중한 의견 고마워요'); });
  },
  createGroup(){
    const name = (document.getElementById('new-group')?.value || '').trim();
    if(!name){ toast('서버 이름을 적어주세요'); return; }
    guard(async () => { const id = await API.createGroup(name); await loadGroups(); if(!S.groupId || !curGroup()?.my_role) await switchTo(id); S.adminGroupId = id; S.page = 'adminGroup'; S.members = await API.listMembers(id) || []; toast(`'${name}' 서버를 만들었어요`); });
  },
  renameGroup(){
    const name = (document.getElementById('rename-group')?.value || '').trim();
    if(!name){ toast('서버 이름을 적어주세요'); return; }
    guard(async () => { await API.renameGroup(S.adminGroupId, name); await loadGroups(); toast('서버 이름을 바꿨어요'); });
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  if(el.type === 'checkbox'){ fn(el.dataset, el); return; }
  if(el.dataset.act === 'noop') return;
  e.preventDefault(); fn(el.dataset, el);
});
function setModel(path, v){ const [o,k] = path.split('.'); if(k === undefined) S.draft[o] = v; else if(S.draft[o]) S.draft[o][k] = v; }
document.addEventListener('input', e => { const m = e.target.dataset?.model; if(m && e.target.type !== 'checkbox') setModel(m, e.target.value); });
document.addEventListener('change', e => { const el = e.target, m = el.dataset?.model; if(!m) return; setModel(m, el.type === 'checkbox' ? el.checked : el.value); });
document.addEventListener('submit', e => { e.preventDefault(); FORMS[e.target.dataset.form]?.(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && S.sheet){ S.sheet = null; render(); } });
setInterval(() => { const a = document.activeElement; if(S.ready && S.session && S.tab === 'pray' && !S.sheet && !(a && /INPUT|TEXTAREA/.test(a.tagName))) render(); }, 30000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && S.session && S.profile && !S.sheet) loadGroupData().then(render).catch(()=>{}); });

/* ─── 완독 축하 ─── */
function completedBooks(){
  const pr = computeProgress(S.profile, S.readings);
  return BOOKS.filter(b => (pr.scope === 'ALL' || b.t === pr.scope) && Array.from({length:b.c}, (_,i) => pr.counts.get(b.id+'-'+(i+1)) || 0).every(c => c >= pr.times)).map(b => b.id);
}
function celebrate(eyebrow, title, sub){
  document.querySelector('.celebrate')?.remove();
  const wrap = document.createElement('div');
  wrap.className = 'celebrate'; wrap.setAttribute('role','status');
  wrap.innerHTML = `<canvas aria-hidden="true"></canvas><div class="celebrate-card"><small>${esc(eyebrow)}</small><strong>${esc(title)}</strong><span>${esc(sub)}</span></div>`;
  document.body.appendChild(wrap);
  const close = () => { if(!wrap.isConnected) return; wrap.classList.add('out'); setTimeout(() => wrap.remove(), 400); };
  wrap.addEventListener('click', close);
  setTimeout(close, 4200);
  try{ navigator.vibrate?.([30,60,30]); }catch(e){}
  if(!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) fireworks(wrap.querySelector('canvas'));
}
function fireworks(cv){
  const dpr = Math.min(2, window.devicePixelRatio || 1), W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const colors = ['#FFB648','#6EAAFF','#E2621B','#8DBF73','#F3EBD2','#FF7AA8','#2F5BD3'];
  const parts = [], rockets = [];
  const launch = () => rockets.push({x: W*(0.15 + Math.random()*0.7), y: H, vy: -(H*0.012 + Math.random()*H*0.006), ty: H*(0.15 + Math.random()*0.35), c: colors[Math.floor(Math.random()*colors.length)]});
  const burst = (x,y,c) => { const n = 70; for(let i=0;i<n;i++){ const a = Math.PI*2*i/n + Math.random()*0.2, sp = 1.5 + Math.random()*3.2; parts.push({x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 1, c: Math.random() < 0.25 ? '#FFFFFF' : c}); } };
  [0,250,600,900,1300,1650,2000,2400].forEach(t => setTimeout(launch, t));
  const t0 = performance.now();
  (function frame(now){
    if(!cv.isConnected) return;
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = 'lighter';
    for(let i=rockets.length-1;i>=0;i--){ const r = rockets[i]; r.y += r.vy; ctx.fillStyle = r.c; ctx.beginPath(); ctx.arc(r.x, r.y, 2.4, 0, 7); ctx.fill(); if(r.y <= r.ty){ burst(r.x, r.y, r.c); rockets.splice(i,1); } }
    for(let i=parts.length-1;i>=0;i--){ const p = parts[i]; p.vx *= 0.985; p.vy = p.vy*0.985 + 0.045; p.x += p.vx; p.y += p.vy; p.life -= 0.012; if(p.life <= 0){ parts.splice(i,1); continue; } ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    if(now - t0 < 4200 || parts.length || rockets.length) requestAnimationFrame(frame);
  })(t0);
}

/* ─── 확대 막기 (iOS 핀치) ─── */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if(e.touches.length > 1) e.preventDefault(); }, {passive:false});

/* ─── 성경 장 드래그 선택 ─── */
let drag = null, press = null, suppressClickUntil = 0;
const cellAt = (x,y) => document.elementFromPoint(x,y)?.closest?.('.grid .ch');
function dragApply(el){
  const k = el?.dataset.k; if(!k || el.disabled || drag.seen.has(k)) return;
  drag.seen.add(k);
  drag.mode ? S.sel.add(k) : S.sel.delete(k);
  el.classList.toggle(S.fixMode ? 'del' : 'sel', drag.mode); el.setAttribute('aria-pressed', String(drag.mode));
}
function dragStart(el){ drag = {mode: !S.sel.has(el.dataset.k), seen: new Set()}; dragApply(el); try{ navigator.vibrate?.(10); }catch(e){} }
function dragEnd(){ if(press?.timer) clearTimeout(press.timer); press = null; if(!drag) return; drag = null; suppressClickUntil = Date.now() + 500; render(); }
document.addEventListener('touchstart', e => {
  const el = e.target.closest?.('.grid .ch'); if(!el || el.disabled || e.touches.length > 1) return;
  const t = e.touches[0];
  press = {el, x:t.clientX, y:t.clientY, timer: setTimeout(() => { if(press) dragStart(press.el); }, 220)};
}, {passive:true});
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if(drag){ e.preventDefault(); dragApply(cellAt(t.clientX, t.clientY)); return; }
  if(press && Math.hypot(t.clientX - press.x, t.clientY - press.y) > 8){ clearTimeout(press.timer); press = null; }
}, {passive:false});
document.addEventListener('touchend', dragEnd);
document.addEventListener('touchcancel', dragEnd);
document.addEventListener('pointerdown', e => {
  if(e.pointerType !== 'mouse' || e.button !== 0) return;
  const el = e.target.closest?.('.grid .ch'); if(el && !el.disabled) press = {el};
});
document.addEventListener('pointermove', e => {
  if(e.pointerType !== 'mouse' || !press) return;
  const c = cellAt(e.clientX, e.clientY);
  if(!drag){ if(c && c !== press.el){ dragStart(press.el); dragApply(c); } return; }
  dragApply(c);
});
document.addEventListener('pointerup', e => { if(e.pointerType === 'mouse') dragEnd(); });

start();
</script>
